    <path d="M60 104H76M60 232H76" stroke-opacity="0.7"/>
    <path d="M68 108V228" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- part drawing: cube with circle -->
    <path d="M880 120L960 80L1040 120L960 160Z"/>
    <path d="M880 120V220L960 260V160M1040 120V220L960 260"/>
    <circle cx="960" cy="120" r="18" stroke-dasharray="4 4"/>
    <path d="M960 60V280M860 120H1060" stroke-opacity="0.4" stroke-dasharray="12 4 2 4"/>

    <!-- ARTEMEON logomark -->
    <svg x="116" y="120" width="105" height="96" viewBox="124 157 776 710" stroke="#ffffff" stroke-width="1" stroke-opacity="1">
      <g transform="matrix(32.1162,0,0,32.201,-844.176,-1850.26) matrix(0.996381,0,0,0.993757,-0.177315,0.185071)">
        <path d="M49.024,63.159L46.992,68.194L52.02,68.194L54.053,63.159L49.024,63.159Z" fill="#ffffff"/>
        <path d="M42.591,79.094L40.558,84.11L45.586,84.11L47.619,79.094L42.591,79.094Z"/>
        <path d="M45.8,71.127L43.769,76.143L48.803,76.143L50.836,71.127L45.8,71.127Z"/>
        <path d="M37.833,71.127L35.801,76.143L40.836,76.143L42.869,71.127L37.833,71.127Z"/>
        <path d="M41.059,63.159L39.027,68.194L44.056,68.194L46.093,63.159L41.059,63.159Z"/>
        <path d="M33.095,63.159L31.064,68.194L36.09,68.194L38.125,63.159L33.095,63.159Z"/>
      </g>
