    <text x="242" y="208" font-size="60" font-weight="700">Support Package</text>
    <text x="452" y="252" font-size="14" text-anchor="middle">composer require artemeon/support</text>
    <text x="52" y="168" font-size="14" text-anchor="middle" transform="rotate(-90 52 168)">PHP 8.4</text>
    <text x="1064" y="90" font-size="13" fill-opacity="0.8">DETAIL A</text>
    <text x="1164" y="254" font-size="13" text-anchor="middle">ARTEMEON/SUPPORT</text>
