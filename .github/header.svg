<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="AGP@ARTEMEON Support Package">
  <defs>
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e0f2fe"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="16" fill="#1d4ed8"/>
  <rect width="1280" height="360" rx="16" fill="url(#minor)"/>
  <rect width="1280" height="360" rx="16" fill="url(#major)"/>

  <g fill="none" stroke="#e0f2fe" stroke-width="1.5">
